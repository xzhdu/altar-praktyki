[project]
name = "ocr-benchmark"
version = "0.1.0"
description = "A lightweight benchmark and comparison tool for OCR engines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rapidocr-onnxruntime>=1.4.4",
    "pytesseract>=0.3.13",
    "python-doctr>=1.0.1",
    "onnxtr[cpu]>=0.9.0",
    "pillow>=12.3.0",
    "opencv-python>=4.14.0.94",
    "matplotlib>=3.11.1",
    "jiwer>=4.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
ocr-benchmark = "ocr_benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
